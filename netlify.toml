[build]
  base = "apps/portal-candidato"
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# NEXT_PUBLIC_SUPABASE_URL e NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY são configuradas
# no painel do Netlify (Site settings → Environment variables), não aqui.
# São valores públicos (a proteção real é o RLS no banco), mas ficam fora do repositório
# para poder trocar de projeto Supabase sem editar código.
